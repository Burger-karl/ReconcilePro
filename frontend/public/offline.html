<!doctype html>
<!-- Shown by public/sw.js when a page can't load without a network (DECISIONS D-68).
     Plain HTML with inline styles: it must work with nothing else downloaded. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · ReconcilePro</title>
    <style>
      :root {
        --background: #ffffff;
        --foreground: #0f172a;
        --muted: #475569;
        --primary: #0f766e;
        --primary-foreground: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #020617;
          --foreground: #f8fafc;
          --muted: #94a3b8;
          --primary: #2dd4bf;
          --primary-foreground: #042f2e;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--background);
        color: var(--foreground);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        color: var(--muted);
        line-height: 1.5;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        padding: 10px 16px;
        border-radius: 8px;
        background: var(--primary);
        color: var(--primary-foreground);
        text-decoration: none;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>ReconcilePro needs a connection to show your invoices and bank lines. Nothing is saved on this device.</p>
      <!-- A plain link: following it asks the network again, and shows this page again if it's still down. -->
      <a href="/dashboard">Try again</a>
    </main>
  </body>
</html>
